[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiju"
version = "0.1.0"
description = "Constrained decoding for classical Chinese poetry"
requires-python = ">=3.10"

[project.optional-dependencies]
agent = []
api = [
    "Pillow>=10.4,<13",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
    "pypinyin>=0.55,<1.0",
    "opencc-python-reimplemented>=0.1.7,<1.0",
    "numpy>=1.26,<3.0",
    "tomli>=2,<3; python_version < '3.11'",
    "tqdm>=4.67,<5.0",
]
gpu = [
    "torch>=2.8,<2.11",
    "transformers>=4.57,<6.0",
    "numpy>=1.26,<3.0",
    "tqdm>=4.67,<5.0",
    "psutil>=7.0,<8.0",
    "pypinyin>=0.55,<1.0",
    "bitsandbytes>=0.49,<1.0",
    "accelerate>=1.15,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
shiju-api = "apps.api.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["shiju*", "apps*"]

[tool.setuptools.package-data]
"apps.api" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
